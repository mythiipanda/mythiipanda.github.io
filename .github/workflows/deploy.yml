name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix apps/dime-landing
      - run: npm run build --prefix apps/dime-landing
        env:
          BASE_PATH: /dime-site
      - run: cp -r apps/dime-landing/out dist/dime-site
      - run: npm ci --prefix apps/dime-variants
      - run: npm run build --prefix apps/dime-variants
        env:
          BASE_PATH: /dime-site
          ASSET_PREFIX: /dime-site/vx
      - run: |
          mkdir -p dist/dime-site/vx
          cp -r apps/dime-variants/out/_next dist/dime-site/vx/_next
          for l in a b c d e f g h i j; do cp -r apps/dime-variants/out/$l dist/dime-site/$l; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
